<!-- airtime: full-width photo with the two-line tagline held on screen while you scroll (animation: scene:airtime) -->
<section id="airtime" data-8b-section="airtime" aria-labelledby="airtime-title">
  <div class="at__hold">
    <div class="at__frame">
      <img style="background:#5a3a2e" class="at__img" src="/media/frontage-diners-1600.webp" alt="Rocksalt's Bay Street shopfront under its red sign, with guests at the footpath tables" width="1600" height="2000" loading="lazy">
      <div class="at__shade" aria-hidden="true"></div>
      <svg class="m-wave at__wave" data-8b-motion="twang" viewBox="0 0 1000 100" preserveAspectRatio="none" aria-hidden="true" focusable="false"><path d="{{WAVE}}"/></svg>
      <div class="wrap at__copy">
        <h2 class="m-text-3 at__title" id="airtime-title"><span class="at__line">Morning coffee.</span> <span class="at__line"><em>Evening company.</em></span></h2>
        <p class="m-text-5 at__text">An independent, all-day neighbourhood venue on Bay Street, a short walk from North Brighton station.</p>
      </div>
    </div>
  </div>
</section>
