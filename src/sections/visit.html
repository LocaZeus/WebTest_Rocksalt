<!-- visit: home location and hours -->
<section id="visit" class="band bg-cream" data-8b-section="visit" aria-labelledby="visit-title">
  <svg class="m-wave" data-8b-motion="twang" viewBox="0 0 1000 100" preserveAspectRatio="none" aria-hidden="true" focusable="false"><path d="{{WAVE}}"/></svg>
  <div class="wrap vs__grid">
    <div class="vs__copy">
      <h2 class="m-text-3 vs__title" id="visit-title" data-8b-motion="hop">We'll see <em>you here.</em></h2>
      <address class="m-text-5" data-8b-motion="hop">360-364 Bay Street<br>Brighton VIC 3186</address>
      <dl class="vs__hours" data-8b-motion="hop">
        <div><dt class="m-text">Every day</dt><dd class="m-text-6">7:30am to 8:30pm</dd></div>
        <div><dt class="m-text">Public holidays</dt><dd class="m-text-6">8am to 3pm</dd></div>
      </dl>
      <p class="m-text">A short walk from North Brighton station. A 15% surcharge applies on public holidays.</p>
      <div class="vs__actions">
        <a class="m-btn m-btn--out" href="{{OT}}" target="_blank" rel="noopener"><span class="m-btn__label">Book a table</span></a>
        <a class="m-link" href="{{MAPS}}" target="_blank" rel="noopener">Directions</a>
        <a class="m-link" href="/contact/">Contact us</a>
      </div>
    </div>
    <figure class="m-frame vs__pic"><img style="background:#5a3a2e;object-position: 50% 30%" src="/media/frontage-diners-1024.webp" alt="Rocksalt's Bay Street shopfront under its red sign, with guests at the footpath tables" width="1024" height="1280" loading="lazy"></figure>
  </div>
</section>
