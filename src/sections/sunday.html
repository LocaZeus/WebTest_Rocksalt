<!-- sunday: home promo for the Sunday live music sessions -->
<section id="sunday" class="band bg-ink" data-8b-section="sunday" aria-labelledby="sunday-title">
  <svg class="m-wave" data-8b-motion="twang" viewBox="0 0 1000 100" preserveAspectRatio="none" aria-hidden="true" focusable="false"><path d="{{WAVE}}"/></svg>
  <div class="wrap sd__grid">
    <div class="sd__copy">
      <p class="m-text-6 m-eyebrow">Live music · every Sunday from 4pm</p>
      <h2 class="m-text-3 sd__title" id="sunday-title" data-8b-motion="hop">Your Sunday, <em>sorted.</em></h2>
      <p class="m-text-5">Walk in. Live music with the Bornstein Ultimatum, every Sunday from 4pm, with no cover. Stay for dinner.</p>
      <div class="sd__facts"><span class="m-badge">Walk in</span><span class="m-badge-2">No cover</span></div>
      <div class="sd__actions">
        <a class="m-btn-3" href="/live-music/"><span class="m-btn-3__label">Sunday sessions</span></a>
        <a class="m-link" href="{{OT}}" target="_blank" rel="noopener">Book a table for dinner</a>
      </div>
    </div>
    <figure class="m-frame sd__photo" data-8b-motion="sticker"><img style="background:#2a1a16;object-position: 40% 50%" src="/media/sunday-red-singer-1024.webp" alt="A singer and band performing to a full Sunday room at Rocksalt" width="1024" height="576" loading="lazy"></figure>
  </div>
</section>
