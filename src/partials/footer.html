<!-- footer: links, address and phone, hours, copyright with the Design: 8B credit, a giant Rocksalt wordmark with three round photos (animation: scene:footer) -->
<footer id="footer" data-8b-section="footer">
  <svg class="m-wave" data-8b-motion="twang" viewBox="0 0 1000 100" preserveAspectRatio="none" aria-hidden="true" focusable="false"><path d="{{WAVE}}"/></svg>
  <div class="wrap">
    <div class="ft__top">
      <nav class="ft__links" aria-label="Footer">
        {{FOOTLINKS}}
        <a class="m-link" href="{{IG}}" target="_blank" rel="noopener">Instagram</a>
        <a class="m-link" href="{{FB}}" target="_blank" rel="noopener">Facebook</a>
      </nav>
      <p class="m-text-6">{{ADDRESS}} · <a class="m-link" href="{{PHONE_HREF}}">{{PHONE}}</a></p>
    </div>
    <div class="ft__meta">
      <p class="m-text-6">Every day 7:30am to 8:30pm · Public holidays 8am to 3pm, 15% surcharge applies</p>
      <p class="m-text-6">© 2026 Unique Flavours Pty Ltd · Design: <a href="https://8b.com/" style="color:inherit" data-8b-credit>8B</a></p>
    </div>
    <div class="ft__mark-wrap">
      <p class="ft__mark m-text-2" style="--len:8">Rocksalt</p>
      <figure class="m-disc ft__disc ft__disc--1"><img style="background:#e9d9cf" src="/media/pancakes-1024.webp" alt="" width="1024" height="768" loading="lazy"></figure>
      <figure class="m-disc ft__disc ft__disc--2"><img style="background:#c9b8a6" src="/media/gallery-food-2-1024.webp" alt="" width="1024" height="1365" loading="lazy"></figure>
      <figure class="m-disc ft__disc ft__disc--3"><img style="background:#2a1a16" src="/media/sunday-singer-band-1024.webp" alt="" width="1024" height="576" loading="lazy"></figure>
    </div>
  </div>
</footer>
